<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ef">
  <title>AR配置テスト</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f3ef; color: #242424; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif; }
    main { width: min(100%, 760px); margin: 0 auto; padding: 24px 18px 40px; }
    h1 { font-size: 1.35rem; font-weight: 650; margin: 0 0 8px; }
    p { line-height: 1.7; font-size: .94rem; }
    .note { color: #666; font-size: .82rem; }
    model-viewer { width: 100%; height: min(66vh, 560px); min-height: 340px; background: #e8e5df; border-radius: 14px; --poster-color: #e8e5df; }
    .ar-button { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); white-space: nowrap; border: 0; border-radius: 999px; padding: 13px 22px; background: #222; color: white; font-size: 15px; font-weight: 600; box-shadow: 0 3px 12px #0003; }
    .steps { background: white; border-radius: 12px; padding: 14px 18px; margin-top: 18px; }
    .steps ol { padding-left: 1.3em; margin: 8px 0 0; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <h1>AR配置テスト</h1>
    <p>これは床への配置とAR起動を確認するためのテストモデルです。ドレスのデータは使用していません。</p>
    <model-viewer
      src="./models/p-dress__20261103_optimized2.glb"
      alt="高さ約1メートルのARテスト用オブジェクト"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-placement="floor"
      ar-scale="auto"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1"
      exposure="1"
      environment-image="neutral"
      interaction-prompt="auto">
      <button slot="ar-button" class="ar-button">部屋に置いてみる</button>
    </model-viewer>
    <section class="steps">
      <strong>確認手順</strong>
      <ol>
        <li>まず画面上でモデルを回転・拡大できるか確認。</li>
        <li>「部屋に置いてみる」を押す。</li>
        <li>カメラを床に向け、端末をゆっくり動かして床を認識させる。</li>
        <li>床にモデルを配置し、大きさ・位置・向きを確認。</li>
      </ol>
    </section>
    <p class="note">AR機能は対応端末・ブラウザでのみ利用できます。iPhoneではSafariのAR Quick Look、Androidでは対応環境のScene ViewerまたはWebXRが使われます。</p>
  </main>
</body>
</html>

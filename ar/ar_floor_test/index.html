<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ef">
  <title>AR VIEW</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      background: #f5f3ef;
      color: #242424;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
    }
    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 18px;
    }
    model-viewer {
      display: block;
      width: 100%;
      height: min(82svh, 760px);
      min-height: 420px;
      background: #e8e5df;
      border-radius: 14px;
      --poster-color: #e8e5df;
      --progress-bar-color: #555;
    }
    .ar-button {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      border: 0;
      border-radius: 999px;
      padding: 13px 22px;
      background: #222;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 3px 12px #0003;
      cursor: pointer;
    }
    .hint {
      margin: 12px 2px 0;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }
    @media (max-width: 480px) {
      main { padding: 10px; }
      model-viewer {
        height: calc(100svh - 54px);
        min-height: 380px;
      }
    }
  </style>
</head>
<body>
  <main>
    <model-viewer
      src="./models/p-dress_20261103_optimized.glb"
      alt="3D scanned dress"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-placement="floor"
      ar-scale="auto"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1"
      exposure="1"
      environment-image="neutral"
      interaction-prompt="auto">
      <button slot="ar-button" class="ar-button">部屋に配置する</button>
    </model-viewer>
    <p class="hint">ドラッグで回転・ピンチで拡大縮小 ／ ARで部屋に配置</p>
  </main>
</body>
</html>
